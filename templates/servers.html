<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择服务器</title><link rel="stylesheet" href="/static/css/fallback.css?v=20260821-1">
<link rel="stylesheet" href="/static/css/tailwind-static.css?v=20260821-1"><meta name="discord-client-id" content="{{ discord_client_id }}"><script src="/static/js/discord-activity.js?v=20260821-8" defer></script><script src="/static/js/i18n.js?v=20260821-3" defer></script></head>
<body class="min-h-screen bg-[#36393f] text-white p-6 md:p-10 overflow-x-hidden"><div class="max-w-5xl mx-auto"><div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-10"><div><h1 class="text-3xl font-bold">选择服务器</h1><p class="text-gray-400 mt-2">你的 Discord 账号拥有多个服务器的数据访问权限</p></div><details class="relative"><summary class="list-none cursor-pointer"><img src="{{ current_user.avatar }}" class="w-10 h-10 rounded-full border border-[#5865f2]"></summary><div class="absolute right-0 mt-2 w-32 p-2 rounded-xl bg-[#202225] shadow-xl z-50"><a href="/me" class="block p-2 hover:bg-[#36393f] rounded">个人主页</a>{% if admin_level %}<a href="/admin" class="block p-2 hover:bg-[#36393f] rounded">Admin</a>{% endif %}<a href="/logout" class="block p-2 text-red-300 hover:bg-[#36393f] rounded">退出登录</a></div></details></div><div class="grid md:grid-cols-2 gap-5">{% for s in servers %}<a href="/server/{{ s.server_id }}" class="bg-[#2f3136] p-6 rounded-2xl hover:bg-[#40444b] transition flex items-center gap-5"><img src="{{ s.icon_url or 'https://cdn.discordapp.com/embed/avatars/0.png' }}" class="w-16 h-16 rounded-2xl"><div><div class="text-xl font-bold">{{ s.name }}</div><div class="text-sm text-gray-500 font-mono mt-1">{{ s.server_id }}</div></div></a>{% endfor %}</div></div></body></html>
